# This file contains the parameters for the MPPI algorithm

# ROS topic names
cmd_topic: /terrasentia/cmd_vel
odom_topic: /terrasentia/dlio/odom_node/odom
# goal_topic: /move_base_simple/goal
reference_topic: /terrasentia/rrt_node/planned_path
map_topic: /terrasentia/octomap_node/traversability_map

# MPPI parameters
horizon: 20
num_samples: 1024
delta_time: 0.5
temperature: 0.01
reference_speed: 0.5
u_min: [-0.2, -3.0] 
u_max: [0.6, 3.0]
noise_mu: [0.2, 0.0]
noise_sigma: [0.5, 1.5]