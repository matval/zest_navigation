# This file contains the parameters for the MPPI algorithm

# ROS topic names
cmd_topic: /cmd_vel
odom_topic: /odom
# goal_topic: /move_base_simple/goal
reference_topic: /zest/rrt_node/planned_path
map_topic: /zest/octomap_node/traversability_map

# Enable source: joystick or service. Both start with motion disabled.
enable_mode: joystick
joy_topic: /joy

# MPPI parameters
horizon: 30
num_samples: 1024
delta_time: 0.5
gamma: 0.01
reference_speed: 0.4
u_min: [-0.2, -2.0] 
u_max: [0.4, 2.0]
noise_mu: [0.2, 0.0]
noise_sigma: [0.2, 0.8]