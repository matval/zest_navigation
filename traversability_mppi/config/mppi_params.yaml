# This file contains the parameters for the MPPI algorithm

# ROS topic names
cmd_topic: /terrasentia/cmd_vel
odom_topic: /terrasentia/dlio/odom_node/odom
goal_topic: /move_base_simple/goal
map_topic: /grid_map

# MPPI parameters
horizon: 20
num_samples: 1024
delta_time: 0.4
temperature: 0.2
reference_speed: 0.6
u_min: [-0.4, -3.0] 
u_max: [0.8, 3.0]
noise_mu: [0.2, 0.0]