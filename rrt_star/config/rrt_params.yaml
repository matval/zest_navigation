# RRT* config
frame_id: odom                                         # Output coordinate frame.

odom_topic: /odom                                      # Odometry input topic.
grid_map_topic: /zest/octomap_node/traversability_map  # Traversability map topic.
goal_topic: /move_base_simple/goal                     # Goal input topic.
alpha1: 100.0                                          # Traversability cost weight.
alpha2: 1.0                                            # Evidence deficit cost weight.
traversability_threshold: 0.10                         # Minimum valid traversability.
planning_frequency: 0.1                                # Target planning frequency (Hz).
solver_time: 10.0                                      # Solve time budget (s).