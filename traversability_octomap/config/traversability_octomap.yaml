# TraversabilityBKIOctoMap config

# Traversability priors
mean_prior: 0.5         # Prior traversability mean in [0, 1]
lambda_prior: 2.01      # Prior evidence weight / Student-t dof; > 1 for CVaR
beta_prior: 0.5         # Prior traversability variance scale

# Octree geometry
resolution: 0.1         # Smallest voxel edge and grid cell size (m)
block_depth: 1          # Octree levels per block, >= 1; edge = 2^(depth-1) * resolution

min_range: 0.5          # Minimum free-space sample distance, not a hit filter (m)
max_range: 10.0         # Maximum accepted hit distance; <= 0 disables (m)

# Point-height limits in the map frame
min_z: -5.0             # Minimum inserted point height (m)
max_z: 5.0              # Maximum inserted point height (m)

# Sparse kernel
sf2: 1.5                # Kernel amplitude scaling measurement evidence
ell: 1.0                # Kernel support radius (m)

# Sampling resolutions
free_resolution: 2.0    # Free-space sample spacing along each beam (m)
ds_resolution: 0.2      # Input cloud downsampling voxel edge (m)

# Occupancy classification
free_thresh: 0.3        # Occupancy probability below which voxel is free
occupied_thresh: 0.7    # Occupancy probability above which voxel is occupied

# Occupancy priors and uncertainty
prior_A: 0.5            # Occupied-class prior pseudo-count
prior_B: 0.5            # Free-class prior pseudo-count
var_thresh: 100.0       # Occupancy variance above which voxel is unknown; 100 disables

# Grid map
confidence_level: 0.95  # Traversability CVaR confidence in (0, 1)
min_z_grid: -1.0        # Minimum voxel height relative to odometry (m)
max_z_grid:  1.0        # Maximum voxel height relative to odometry (m)
